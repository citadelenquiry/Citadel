name: Deploy to Hostinger

# Triggers automatically on push to main or master, or manually from Actions tab
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: "hostinger-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Application for Production
        run: npm run build
        env:
          # Root base path for custom domain hosting on Hostinger
          VITE_BASE_PATH: /

      - name: Verify Built Files in dist
        run: |
          echo "Listing compiled distribution files to be uploaded:"
          ls -la dist/
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: index.html not found in dist!"
            exit 1
          fi

      - name: Sanitize Hostinger FTP Server Input
        id: prepare-ftp
        run: |
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          # Strip protocol (ftp://, ftps://, https://, http://)
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z0-9]+://||')
          # Strip trailing path (/public_html or /)
          CLEAN_SERVER=$(echo "$CLEAN_SERVER" | cut -d'/' -f1)
          # Strip port if user added :21
          CLEAN_SERVER=$(echo "$CLEAN_SERVER" | cut -d':' -f1)
          # Remove all spaces/newlines
          CLEAN_SERVER=$(echo "$CLEAN_SERVER" | tr -d '[:space:]')
          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Deploy dist folder to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.prepare-ftp.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ${{ secrets.HOSTINGER_PROTOCOL || 'ftp' }}
          # Local built files
          local-dir: ./dist/
          # Deploy directly to the root of the FTP account (which is public_html)
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || './' }}
          # Keep files clean and sync efficiently
          dangerous-clean-slate: false
